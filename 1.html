<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三色連線遊戲</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial,"Microsoft JhengHei",sans-serif}
body{display:flex;justify-content:center;background:#10251e}.app{width:min(100vw,520px);height:100dvh;position:relative;background:#58796d;overflow:hidden}
.top{height:72px;position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(7,24,19,.9);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 15px}
.info{font-size:13px;line-height:1.4}.info b{font-size:21px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:bold;font-size:14px;color:#17382e}
#game{position:absolute;top:72px;left:0;width:100%;height:calc(100% - 72px);touch-action:none}
.hint{position:absolute;top:82px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:#0006;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap}
.message{position:absolute;top:72px;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0002}
.card{width:80%;max-width:360px;padding:25px 20px;border-radius:22px;background:#081813ed;color:#fff;text-align:center;box-shadow:0 15px 50px #0006}.card h1{margin:0 0 10px}.card p{line-height:1.6;color:#dbe8e3}.start{font-size:18px;border-radius:30px;padding:13px 32px}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="info">三色連線<br><b>時間：<span id="timer">30</span> 秒</b></div><button id="restart">重新開始</button></div>
<canvas id="game"></canvas><div id="hint" class="hint">相同顏色連線，碰到其他顏色就失敗</div>
<div id="message" class="message"><div class="card"><h1 id="title">🎮 三色連線</h1><p id="text">把相同顏色的兩個圓點連起來。<br>不同顏色的線不能互相碰到。</p><button id="start" class="start">開始遊戲</button></div></div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),timer=document.getElementById("timer"),msg=document.getElementById("message"),title=document.getElementById("title"),text=document.getElementById("text"),start=document.getElementById("start"),restart=document.getElementById("restart"),hint=document.getElementById("hint");
let W,H,dpr,playing=false,left=30,clock,active=null,lines=[],nodes=[],done=new Set();
const C={red:"#d71920",green:"#159447",blue:"#1268c9"};

function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",resize);
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function ori(a,b,z){let v=(b.y-a.y)*(z.x-b.x)-(b.x-a.x)*(z.y-b.y);return Math.abs(v)<.01?0:v>0?1:2}
function onseg(a,b,z){return z.x>=Math.min(a.x,b.x)-1&&z.x<=Math.max(a.x,b.x)+1&&z.y>=Math.min(a.y,b.y)-1&&z.y<=Math.max(a.y,b.y)+1}
function cross(a,b,z,w){let p=ori(a,b,z),q=ori(a,b,w),r=ori(z,w,a),s=ori(z,w,b);return(p!=q&&r!=s)||(p==0&&onseg(a,b,z))||(q==0&&onseg(a,b,w))||(r==0&&onseg(z,w,a))||(s==0&&onseg(z,w,b))}
function pd(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;if(!L)return dist(p,a);let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function setup(){
 let t=70,b=H-35,w=W;
 nodes=[
 {c:"red",x:w*.24,y:t+(b-t)*.16},{c:"red",x:w*.76,y:t+(b-t)*.80},
 {c:"green",x:w*.25,y:t+(b-t)*.80},{c:"green",x:w*.73,y:t+(b-t)*.25},
 {c:"blue",x:w*.15,y:t+(b-t)*.48},{c:"blue",x:w*.85,y:t+(b-t)*.53}
 ].map(n=>({...n,x:n.x+(Math.random()-.5)*14,y:n.y+(Math.random()-.5)*14,r:16}));
 lines=[];done.clear();active=null;
}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function near(p){for(let i=0;i<nodes.length;i++){let n=nodes[i];if(done.has(i))continue;if(dist(p,n)<34)return [n,i]}return null}
function hitOther(a,b,color){
 for(let L of lines)if(L.c!==color)for(let i=1;i<L.p.length;i++)if(cross(a,b,L.p[i-1],L.p[i]))return true;
 for(let n of nodes)if(n.c!==color&&pd(n,a,b)<n.r+5)return true;
 return false;
}
function fail(){playing=false;clearInterval(clock);active=null;title.textContent="❌ 失敗";text.innerHTML="線碰到了另一種顏色的線或圓點。<br>再試一次！";start.textContent="重新開始";msg.classList.remove("hidden");hint.classList.add("hidden");draw()}
function win(){playing=false;clearInterval(clock);active=null;title.textContent="🎉 過關！";text.innerHTML="三組顏色全部成功連線！";start.textContent="再玩一次";msg.classList.remove("hidden");hint.classList.add("hidden");draw()}
function begin(){left=30;timer.textContent=left;setup();playing=true;msg.classList.add("hidden");hint.classList.remove("hidden");clearInterval(clock);clock=setInterval(()=>{left--;timer.textContent=left;if(left<=0){playing=false;clearInterval(clock);title.textContent="⏰ 時間到";text.innerHTML="30 秒內沒有完成，再挑戰一次！";start.textContent="重新開始";msg.classList.remove("hidden");hint.classList.add("hidden");draw()}},1000);draw()}
c.addEventListener("pointerdown",e=>{if(!playing)return;let q=near(pos(e));if(q){active={c:q[0].c,s:q[0],i:q[1],p:[{x:q[0].x,y:q[0].y}]};c.setPointerCapture?.(e.pointerId);draw()}});
c.addEventListener("pointermove",e=>{if(!playing||!active)return;let p=pos(e),last=active.p.at(-1);p.x=Math.max(1,Math.min(W-1,p.x));p.y=Math.max(1,Math.min(H-1,p.y));if(hitOther(last,p,active.c)){fail();return}active.p.push(p);draw()});
c.addEventListener("pointerup",e=>{if(!playing||!active)return;let p=pos(e),target=null,ti=-1;for(let i=0;i<nodes.length;i++){let n=nodes[i];if(i!==active.i&&!done.has(i)&&n.c===active.c&&dist(p,n)<38){target=n;ti=i;break}}if(!target){active=null;draw();return}let last=active.p.at(-1);if(hitOther(last,target,active.c)){fail();return}active.p.push({x:target.x,y:target.y});lines.push({c:active.c,p:active.p.slice()});done.add(active.i);done.add(ti);active=null;draw();if(done.size===nodes.length)win()});
c.addEventListener("pointercancel",()=>{active=null;draw()});
start.onclick=begin;restart.onclick=begin;

function draw(){
 x.clearRect(0,0,W,H);
 let cx=W/2,cy=H/2+20,r=Math.min(W*.43,H*.39);
 x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle="#b5b5b5";x.fill();x.lineWidth=2;x.strokeStyle="#17251f";x.stroke();x.save();x.clip();
 for(let L of lines)line(L.p,L.c);if(active)line(active.p,active.c);x.restore();
 nodes.forEach((n,i)=>{x.beginPath();x.arc(n.x,n.y,n.r,0,Math.PI*2);x.fillStyle=C[n.c];x.fill();x.lineWidth=2;x.strokeStyle="#111";x.stroke();if(done.has(i)){x.beginPath();x.arc(n.x,n.y,10,0,Math.PI*2);x.strokeStyle="#ffffff88";x.lineWidth=2;x.stroke()}});
}
function line(p,col){if(p.length<2)return;x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)x.lineTo(p[i].x,p[i].y);x.strokeStyle=C[col];x.lineWidth=10;x.lineCap="round";x.lineJoin="round";x.stroke()}
resize();
</script>
</body>
</html>
