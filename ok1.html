<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>端午節 MAX 版</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:"Microsoft JhengHei",sans-serif;

    background:
    linear-gradient(
    to bottom,
    #02150e,
    #063c28,
    #0a6b42);

}

/* ===== 場景 ===== */

.scene{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

}

/* ===== 月亮 ===== */

.moon{

    position:absolute;

    top:60px;
    right:40px;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #fffde7,
    #ffe082);

    box-shadow:
    0 0 50px gold,
    0 0 100px rgba(255,215,0,.6);

    animation:moonGlow 4s infinite alternate;

}

@keyframes moonGlow{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }

}

/* ===== 雲 ===== */

.cloud{

    position:absolute;

    color:white;

    opacity:.7;

    font-size:60px;

    animation:cloudMove linear infinite;

}

@keyframes cloudMove{

    from{
        transform:translateX(-200px);
    }

    to{
        transform:translateX(120vw);
    }

}

/* ===== 河流 ===== */

.river{

    position:absolute;

    bottom:0;

    width:200%;
    height:220px;

    background:
    radial-gradient(circle at 50% 0%,
    rgba(255,255,255,.25),
    transparent 70%);

    animation:riverMove 12s linear infinite;

}

@keyframes riverMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}

/* ===== 卡片 ===== */

.card{

    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:92%;
    max-width:430px;

    min-height:60vh;

    border-radius:35px;

    background:
    rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border:
    1px solid rgba(255,255,255,.2);

    box-shadow:
    0 0 50px rgba(0,0,0,.5);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    z-index:10;

}

/* ===== 標題 ===== */

.title{

    font-size:
    clamp(38px,8vw,58px);

    color:#fff3b0;

    font-weight:bold;

    text-shadow:
    0 0 20px gold;

}

/* ===== 3D 粽子 ===== */

.zongzi{

    position:relative;

    margin:20px 0;

    font-size:120px;

    cursor:pointer;

    animation:
    zFloat 3s infinite ease-in-out,
    zRotate 6s linear infinite;

}

@keyframes zFloat{

    0%,100%{
        transform:
        translateY(0px);
    }

    50%{
        transform:
        translateY(-18px);
    }

}

@keyframes zRotate{

    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }

}

/* ===== 眼睛 ===== */

.eye{

    position:absolute;

    width:12px;
    height:12px;

    background:black;

    border-radius:50%;

    top:48px;

    animation:blink 4s infinite;

}

.left-eye{
    left:45px;
}

.right-eye{
    right:45px;
}

@keyframes blink{

    0%,95%,100%{
        height:12px;
    }

    97%{
        height:2px;
    }

}

/* ===== 嘴巴 ===== */

.mouth{

    position:absolute;

    width:20px;
    height:10px;

    border-bottom:
    4px solid #ff4d6d;

    border-radius:50%;

    left:50%;

    transform:
    translateX(-50%);

    top:70px;

}

/* ===== 說話泡泡 ===== */

.speech{

    position:absolute;

    top:-20px;

    background:white;

    color:#333;

    padding:10px 16px;

    border-radius:20px;

    font-size:16px;

    opacity:0;

    transition:.4s;

}

/* ===== 訊息 ===== */

.msg{

    color:white;

    font-size:20px;

    line-height:1.8;

}

/* ===== 按鈕 ===== */

.btn{

    margin-top:22px;

    border:none;

    padding:14px 34px;

    border-radius:50px;

    background:
    linear-gradient(
    45deg,
    #00ff99,
    #00bfff);

    color:white;

    font-size:20px;

}

/* ===== 音樂按鈕 ===== */

.music-btn{

    position:absolute;

    top:
    calc(20px + env(safe-area-inset-top));

    right:20px;

    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:
    linear-gradient(
    45deg,
    #ffcc00,
    #ff8800);

    color:white;

    font-size:24px;

    z-index:50;

}

/* ===== 花瓣 ===== */

.petal{

    position:absolute;

    animation:fall linear infinite;

}

@keyframes fall{

    from{
        transform:
        translateY(-10vh)
        rotate(0deg);
    }

    to{
        transform:
        translateY(110vh)
        rotate(360deg);
    }

}

/* ===== 煙火 ===== */

.firework{

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    animation:boom 1s forwards;

}

@keyframes boom{

    from{
        transform:scale(1);
        opacity:1;
    }

    to{
        transform:scale(8);
        opacity:0;
    }

}

/* ===== 手機 ===== */

@media(max-width:420px){

    .title{
        font-size:36px;
    }

    .zongzi{
        font-size:95px;
    }

    .msg{
        font-size:17px;
    }

    .btn{
        font-size:17px;
        width:90%;
    }

}

</style>
</head>

<body>

<div class="scene">

    <!-- 月亮 -->
    <div class="moon"></div>

    <!-- 雲 -->
    <div class="cloud"
    style="
    top:100px;
    animation-duration:25s;">
    ☁️
    </div>

    <div class="cloud"
    style="
    top:180px;
    font-size:45px;
    animation-duration:35s;">
    ☁️
    </div>

    <!-- 河流 -->
    <div class="river"></div>

    <!-- 音樂 -->
    <button
    class="music-btn"
    id="musicBtn"
    onclick="toggleMusic()">

    🔊

    </button>

    <!-- 卡片 -->
    <div class="card">

        <div class="title">

        端午安康

        </div>

        <!-- 粽子 -->
        <div
        class="zongzi"
        onclick="clickZongzi()">

            🍙

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="mouth"></div>

            <div
            class="speech"
            id="speech">

            端午快樂 ❤️

            </div>

        </div>

        <div class="msg">

            點擊粽子有驚喜 🎁
            <br>
            點畫面會放煙火 ✨

        </div>

        <button
        class="btn"
        onclick="playBlessSound()">

        播放祝福語音 🔊

        </button>

    </div>

</div>

<!-- 背景音樂 -->
<audio id="bgm" loop>
<source src="https://m-jpg533.github.io/oxs/57.mp3">
</audio>

<!-- 點擊音效 -->
<audio id="clickSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_7b1d8d4f5b.mp3?filename=click-124467.mp3">
</audio>

<!-- 手機可播放祝福音效 -->
<audio id="blessSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8f2b6c6d7.mp3?filename=ancient-chinese-background-music-11256.mp3">
</audio>

<script>

/* ===== 音樂 ===== */

const bgm=
document.getElementById("bgm");

let playing=true;

/* 手機需要使用者互動 */

document.body.addEventListener("click",()=>{

    bgm.play();

},{once:true});

/* ===== 音樂開關 ===== */

function toggleMusic(){

    const btn=
    document.getElementById("musicBtn");

    if(playing){

        bgm.pause();

        btn.innerHTML="🔇";

    }else{

        bgm.play();

        btn.innerHTML="🔊";

    }

    playing=!playing;

}

/* ===== 粽子點擊 ===== */

function clickZongzi(){

    const speech=
    document.getElementById("speech");

    const msgs=[

        "端午快樂 ❤️",
        "財運旺旺 💰",
        "平安健康 🍀",
        "粽子吃飽飽 😆"

    ];

    const text=
    msgs[
    Math.floor(
    Math.random()*msgs.length)];

    speech.innerHTML=text;

    speech.style.opacity=1;

    setTimeout(()=>{

        speech.style.opacity=0;

    },2000);

    document
    .getElementById("clickSound")
    .play();

}

/* ===== 手機版祝福音效 ===== */

function playBlessSound(){

    const sound=
    document.getElementById("blessSound");

    sound.currentTime=0;

    sound.play();

}

/* ===== 花瓣 ===== */

const flowers=
["🌸","🍃","✨"];

for(let i=0;i<60;i++){

    let p=
    document.createElement("div");

    p.className="petal";

    p.innerHTML=
    flowers[
    Math.floor(
    Math.random()*3)];

    p.style.left=
    Math.random()*100+"vw";

    p.style.fontSize=
    (18+Math.random()*20)+"px";

    p.style.animationDuration=
    (6+Math.random()*6)+"s";

    document.body.appendChild(p);

}

/* ===== 點擊煙火 ===== */

document.addEventListener("click",(e)=>{

    for(let i=0;i<12;i++){

        let f=
        document.createElement("div");

        f.className="firework";

        f.style.left=
        e.clientX+"px";

        f.style.top=
        e.clientY+"px";

        f.style.background=

        `hsl(${Math.random()*360},
        100%,60%)`;

        document.body.appendChild(f);

        setTimeout(()=>{

            f.remove();

        },1000);

    }

});

</script>

</body>
</html>
