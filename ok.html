<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Q版端午節賀卡</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#082b1d;
}

/* ===== 背景 ===== */

.scene{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(to bottom,
    #02150e,
    #063c28,
    #0a6b42);
}

/* ===== 音樂按鈕 ===== */

.music-btn{

    position:absolute;
    top:20px;
    right:20px;

    width:60px;
    height:60px;

    border:none;
    border-radius:50%;

    background:linear-gradient(45deg,#ffcc00,#ff8800);

    color:white;
    font-size:26px;

    z-index:50;

    box-shadow:0 0 20px rgba(255,200,0,.6);

    animation:musicGlow 2s infinite alternate;

}

.music-btn:active{
    transform:scale(.9);
}

@keyframes musicGlow{
    from{box-shadow:0 0 10px rgba(255,200,0,.4);}
    to{box-shadow:0 0 30px rgba(255,200,0,.9);}
}

/* ===== 月亮 ===== */

.moon{
    position:absolute;
    top:60px;
    right:50px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:radial-gradient(circle,#fffde7,#ffe082);
    box-shadow:0 0 40px gold,0 0 80px rgba(255,215,0,.5);
    animation:moonGlow 4s infinite alternate;
}

@keyframes moonGlow{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

/* ===== 雲 ===== */

.cloud{
    position:absolute;
    color:white;
    opacity:.7;
    font-size:60px;
    animation:cloudMove linear infinite;
}

@keyframes cloudMove{
    from{transform:translateX(-200px);}
    to{transform:translateX(120vw);}
}

/* ===== 河流 ===== */

.river{
    position:absolute;
    bottom:0;
    width:200%;
    height:220px;
    background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.25),transparent 70%);
    animation:riverMove 12s linear infinite;
}

@keyframes riverMove{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
}

/* ===== 卡片 ===== */

.card{

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:92%;
    max-width:430px;
    height:78vh;

    border-radius:35px;

    background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05));

    backdrop-filter:blur(15px);

    border:2px solid rgba(255,255,255,.2);

    box-shadow:0 0 40px rgba(0,0,0,.5),0 0 60px rgba(0,255,150,.15);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px;

    z-index:5;
}

/* ===== 標題 ===== */

.title{
    font-size:52px;
    color:#fff3b0;
    font-weight:bold;
    text-shadow:0 0 15px gold;
}

/* ===== 粽子 ===== */

.zongzi{
    font-size:120px;
    margin:20px 0;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

/* ===== 文字 ===== */

.msg{
    color:white;
    font-size:20px;
    line-height:1.8;
}

/* ===== 按鈕 ===== */

.btn{

    margin-top:25px;
    border:none;
    padding:14px 34px;
    border-radius:50px;

    background:linear-gradient(45deg,#00ff99,#00bfff);
    color:white;
    font-size:20px;

}

/* ===== 花瓣 ===== */

.petal{
    position:absolute;
    font-size:20px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{transform:translateY(-10vh);}
    to{transform:translateY(110vh);}
}

</style>
</head>

<body>

<div class="scene">

    <!-- 音樂按鈕 -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🔊</button>

    <!-- 月亮 -->
    <div class="moon"></div>

    <!-- 雲 -->
    <div class="cloud" style="top:120px;animation-duration:25s;">☁️</div>
    <div class="cloud" style="top:200px;animation-duration:35s;font-size:45px;">☁️</div>

    <!-- 河流 -->
    <div class="river"></div>

    <!-- 卡片 -->
    <div class="card">

        <div class="title">端午安康</div>

        <div class="zongzi">🍙</div>

        <div class="msg">
            粽香飄滿幸福 ❤️<br>
            天天好運 🍀<br>
            平安健康 ✨
        </div>

        <button class="btn" onclick="showBless()">領取祝福 🎁</button>

    </div>

</div>

<!-- 音樂 -->
<audio id="bgm" loop>
    <source src="https://m-jpg533.github.io/oxs/57.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== 自動播放（第一次點擊才啟動） ===== */
const bgm = document.getElementById("bgm");
let playing = true;

window.addEventListener("click",()=>{
    bgm.play();
},{once:true});

/* ===== 音樂開關 ===== */

function toggleMusic(){

    const btn=document.getElementById("musicBtn");

    if(playing){
        bgm.pause();
        btn.innerHTML="🔇";
    }else{
        bgm.play();
        btn.innerHTML="🔊";
    }

    playing=!playing;
}

/* ===== 花瓣 ===== */

for(let i=0;i<50;i++){

    let p=document.createElement("div");

    p.className="petal";
    p.innerHTML=["🌸","🍃","✨"][Math.floor(Math.random()*3)];

    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(6+Math.random()*6)+"s";
    p.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(p);
}

/* ===== 祝福 ===== */

function showBless(){

    const msgs=[
        "端午快樂 ❤️",
        "平安健康 ✨",
        "財運旺 💰",
        "天天好心情 🍀"
    ];

    alert(msgs[Math.floor(Math.random()*msgs.length)]);
}

</script>

</body>
</html>
